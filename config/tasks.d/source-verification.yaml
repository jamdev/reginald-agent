# Reginald discovers this task automatically. Its name is the filename without the extension.
# Override individual fields under tasks.<name> in dev.yaml or prod.yaml. List overrides replace the whole list.
title: Source verification
prompt_file: Setup/Tasks/Source verification.md
runner: claude-agent
# URL reachable/unchanged -> flag (for humans, not email). Watch the
# "materially changed" judgment on Haiku; bump back to sonnet if it flags noise.
model: claude-haiku-5-5
tools: [Read, Write, Edit, Glob, Grep, WebFetch]
max_turns: 80
post: [normalize-frontmatter, backfill-uuids, set-publish]  # clean fm, valid uuid, publish flag
